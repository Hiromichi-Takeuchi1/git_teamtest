<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文確認</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f7f7f7;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .order {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .order h2 {
            margin-top: 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding: 8px 0;
        }

        .total {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            background-color: #eee;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>🍽️ 注文確認</h1>

    <div class="order">
        <h2>テーブル1</h2>

        <div class="item">
            <span>ブレンドコーヒー × 2</span>
            <span>800円</span>
        </div>

        <div class="item">
            <span>チーズケーキ × 1</span>
            <span>500円</span>
        </div>

        <p class="total">合計：1,300円</p>

        <span class="status">受付</span>
    </div>


    <div class="order">
        <h2>テーブル2</h2>

        <div class="item">
            <span>ナポリタン × 1</span>
            <span>900円</span>
        </div>

        <div class="item">
            <span>オレンジジュース × 1</span>
            <span>350円</span>
        </div>

        <p class="total">合計：1,250円</p>

        <span class="status">調理中</span>
    </div>


    <div class="order">
        <h2>テーブル3</h2>

        <div class="item">
            <span>カレーライス × 1</span>
            <span>850円</span>
        </div>

        <div class="item">
            <span>プリン × 2</span>
            <span>900円</span>
        </div>

        <p class="total">合計：1,750円</p>

        <span class="status">提供済み</span>
    </div>

</body>
</html>
